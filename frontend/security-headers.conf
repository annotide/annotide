# Security headers (SEC-4).
#
# Kept in their own file and `include`d into every block that sets any header
# of its own. nginx's add_header inheritance is all-or-nothing: a location
# containing even one add_header discards EVERY add_header from its parent.
# Declaring these once in `server` therefore silently drops them from any
# location that sets, say, Cache-Control — which is exactly the bug this file
# exists to prevent. Include it wherever you add a header.
#
# `__CSP_MEDIA_ORIGINS__` is substituted at image build time from the
# CSP_MEDIA_ORIGINS build arg (see frontend/Dockerfile). It defaults to
# `https:`, which is every real customer's object storage. The local stack
# overrides it to also allow Azurite over plain http — without that the
# browser blocks every signed media URL and the annotator shows an empty
# canvas, which looks exactly like a broken backend.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __CSP_MEDIA_ORIGINS__; font-src 'self' data:; connect-src 'self' __CSP_MEDIA_ORIGINS__; media-src 'self' blob: __CSP_MEDIA_ORIGINS__; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

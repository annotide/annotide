# nginx.conf — serves the built SPA and proxies API calls to the backend.
#
# Runs inside the frontend container on port 80 (compose maps host 5173 ->
# container 80, matching the Vite dev port from CONTRACTS.md so URLs stay
# familiar between `npm run dev` and the containerised stack).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's stock mime.types has no .mjs, and with `nosniff` a browser
    # refuses an octet-stream module worker (pdf.js ships its worker as
    # .mjs). A `types` block here would replace the whole map, so the stock
    # map is included first and extended.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    # ------------------------------------------------------------------
    # Security headers (SEC-4)
    # ------------------------------------------------------------------
    # CSP: default-deny, then allow only what the app actually needs.
    #   - 'self' for scripts/styles/images/fonts/connect: everything is
    #     bundled by Vite, no third-party CDNs in Phase 1.
    #   - style-src allows 'unsafe-inline' because Konva/react-konva and a
    #     few Tailwind-generated utility patterns can inject inline style
    #     attributes on canvas-adjacent elements; there is no inline
    #     <script> usage so script-src stays locked to 'self'.
    #   - img-src adds data: and blob: for canvas thumbnails / Konva stage
    #     exports and object URLs used when previewing signed media URLs.
    #   - connect-src adds the backend origin implicitly via 'self' since
    #     /api/ is same-origin (proxied below); blob: signed URLs to cloud
    #     storage are cross-origin by design (SRC-1), so connect-src also
    #     allows https: for those (they are short-lived, credentialed URLs
    #     returned by the API, not arbitrary third parties).
    #   - frame-ancestors 'none' + X-Frame-Options DENY: belt and braces
    #     against clickjacking.
    include /etc/nginx/security-headers.conf;

    # ------------------------------------------------------------------
    # API proxy
    # ------------------------------------------------------------------
    # Backend service name/port come from docker-compose.yml (service
    # "backend", port 8000 per CONTRACTS.md). The name is looked up through
    # Docker's DNS at request time (a variable in proxy_pass), not once at
    # start-up: a recreated backend gets a new address, and a cached one
    # answers 502 until nginx restarts. With a variable and no URI part,
    # proxy_pass sends the request path unchanged (/api/...).
    # (Helm ships its own config for this; see templates/frontend.yaml.)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # Static assets — Vite fingerprints these (content hash in filename),
    # so they are safe to cache forever.
    # ------------------------------------------------------------------
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # SPA fallback — index.html must always be revalidated so a fresh
    # deploy's asset references are picked up.
    # ------------------------------------------------------------------
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}

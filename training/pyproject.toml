[project]
name = "annotide-training"
version = "0.1.0"
description = "Reference training pipeline for the Annotide annotation platform, run on your own compute"
readme = "README.md"
requires-python = ">=3.12"
# ELv2 like the rest of the repo; only sdk/ is Apache-2.0 (LICENSE.md at the root).
license = "Elastic-2.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Annotide" }]
keywords = ["annotation", "training", "computer-vision", "mlops", "onnx", "mlflow"]
# No `License ::` classifiers: PEP 639 `license` expressions replace them.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# The platform never trains (ML-9); this runs on the customer's side. The
# pipeline talks to the platform through the SDK (../sdk, API-3) — a real
# trainer brings its own framework as an extra, never the platform image.
# In a checkout, install ../sdk first so pip uses it instead of PyPI's.
dependencies = [
    "annotide>=0.1",
]

[project.optional-dependencies]
# `--trainer fasterrcnn`: torchvision's Faster R-CNN, exported to ONNX for
# model-service's onnx backend. All BSD / MIT / Apache licensed.
torch = [
    "torch>=2.5",
    "torchvision>=0.20",
    "onnx>=1.16",
    "onnxruntime>=1.20",
    "numpy>=2.1",
    "pillow>=11.0",
]
# `--mlflow-experiment`: record runs in MLflow / Databricks / Azure ML (API-6).
mlflow = ["mlflow-skinny>=3.1"]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.urls]
Homepage = "https://annotide.com"
Documentation = "https://github.com/annotide/annotide/tree/main/training#readme"
Source = "https://github.com/annotide/annotide/tree/main/training"
Issues = "https://github.com/annotide/annotide/issues"
Changelog = "https://github.com/annotide/annotide/releases"

[project.scripts]
annotide-train = "annotide_training.cli:main"

[build-system]
requires = ["setuptools>=77"]  # PEP 639 `license` expressions
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["annotide_training*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["annotide_training", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["annotide_training"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
# The SDK is installed editable from ../sdk, which mypy cannot follow.
mypy_path = "../sdk"

[[tool.mypy.overrides]]
# No type information shipped; torch itself is typed.
module = ["torchvision.*", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The `mlflow` extra: optional, partly untyped. Any either way.
module = ["mlflow", "mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

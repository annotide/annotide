[project]
name = "annotide-backend"
version = "0.1.0"
description = "Cloud-agnostic annotation platform — API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",  # opentelemetry-instrumentation-sqlalchemy supports <2.1
    "asyncpg>=0.30",
    "alembic>=1.14",
    # PyJWT, not python-jose: jose drags in `ecdsa` (CVE-2024-23342, no fix)
    # and is barely maintained. Already a dependency of msal and redis.
    "PyJWT[crypto]>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "redis>=5.2",
    "arq>=0.26",
    "structlog>=24.4",
    # azure-core picks its HTTP transport at runtime and does not declare these:
    # `requests` for the sync path, `aiohttp` for the async credentials we use.
    # Without them, constructing a credential raises ImportError.
    "requests>=2.32",
    "aiohttp>=3.10",
    "azure-identity>=1.19",
    "azure-storage-blob>=12.24",
    # s3 / gcs connectors (SRC-1)
    "aioboto3>=15.5",
    "google-cloud-storage>=3.0",
    # Thumbnails (IMG-8). The worker shares the image, so this is a runtime dep.
    "pillow>=11.0",
    # Large-image tiling (IMG-1, IMG-2). The `binary` extra bundles libvips
    # itself, so no system package is needed in the runtime image.
    "pyvips[binary]>=2.2",
    # PDF items (TOOL): page-1 thumbnail and page count / sizes in `meta`.
    # PDFium (BSD-3 / Apache-2.0), bundled in the wheel; ~7 MB, no system deps.
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
# OpenTelemetry (OPS-3), opt-in: not in the default image. OTLP over HTTP,
# not gRPC, so grpcio stays out even when it is installed.
otel = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-redis>=0.51b0",
]
# Secret stores (AUTH-7), opt-in. AWS Secrets Manager needs nothing extra:
# boto3 already comes with aioboto3 for the S3 connector.
keyvault = ["azure-keyvault-secrets>=4.9"]
gcp-secrets = ["google-cloud-secret-manager>=2.20"]
# ML platforms (API-6): MLflow, Databricks and Azure ML all through MLflow's
# REST client. The skinny package, not `mlflow` (which brings the server,
# pandas and numpy); it includes databricks-sdk for Databricks auth and Jobs.
mlflow = ["mlflow-skinny>=3.1"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "moto[server]>=5.2",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Demo photos + their attribution, so `pip install .` ships a working seeder.
app = ["demo_samples/*.jpg", "demo_samples/*.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["A003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Optional secret-store SDKs: imported lazily and only when that backend
# is used, so they are deliberately not installed by default.
module = ["alembic.*", "arq.*", "boto3.*", "google.cloud.*", "azure.keyvault.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ML platforms (API-6), the `mlflow` extra: imported lazily, partly untyped,
# and not installed in the default image. Treated as Any either way.
module = ["mlflow", "mlflow.*", "databricks", "databricks.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# No type stubs published for pyvips or pypdfium2.
module = ["pyvips", "pyvips.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py", "alembic/*"]

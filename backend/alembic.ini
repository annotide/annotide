[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Timezone for the "created at" comment in new revision files.
timezone = UTC

# Max length of the "slug" field appended to migration filenames.
truncate_slug_length = 40

# Version location(s), relative to script_location.
version_locations = %(here)s/alembic/versions

version_path_separator = os

# The actual database URL is supplied at runtime by alembic/env.py, which
# reads it from app.core.config.Settings (APP_DATABASE_URL). This placeholder
# is never used directly.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

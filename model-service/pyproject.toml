[project]
name = "annotide-model-service"
version = "0.1.0"
description = "Cloud-agnostic annotation platform — reference model service (BYOM-4 template)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pillow>=11.0",
    "numpy>=2.1",
    "structlog>=24.4",
    # PDF items: words and their boxes for the document-field rules.
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.20",
]
# OCR through Claude (OCR_ENGINE=anthropic). The OpenAI-compatible engine needs
# nothing extra, and Tesseract is a system binary.
llm = [
    "anthropic>=1.8",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
    "pytest-httpserver>=1.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["A003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

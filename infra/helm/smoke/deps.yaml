# Throwaway PostgreSQL and Redis for the k3s smoke test only (not for real use).
apiVersion: v1
kind: Namespace
metadata: { name: annotate }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: pg-init, namespace: annotate }
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS citext;
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: annotate }
spec:
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: annotation }
            - { name: POSTGRES_PASSWORD, value: k3s-test-pw }
            - { name: POSTGRES_DB, value: annotation }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, annotation] }, periodSeconds: 3 }
          volumeMounts: [{ name: init, mountPath: /docker-entrypoint-initdb.d }]
      volumes: [{ name: init, configMap: { name: pg-init } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: annotate }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: annotate }
spec:
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - { name: redis, image: "redis:7-alpine", ports: [{ containerPort: 6379 }] }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: annotate }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }

{{- if .Values.model.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ap.fullname" . }}-model
  labels:
    {{- include "ap.labels" (dict "ctx" . "component" "model") | nindent 4 }}
spec:
  replicas: {{ .Values.model.replicas }}
  selector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "ctx" . "component" "model") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ap.selectorLabels" (dict "ctx" . "component" "model") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "ap.podSecurityContext" (dict "ctx" . "uid" .Values.model.uid) | nindent 8 }}
      containers:
        - name: model
          image: {{ include "ap.image" (dict "ctx" . "image" .Values.image.model) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9000
          {{- with .Values.model.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ toString $value | quote }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.model.resources | nindent 12 }}
          securityContext:
            {{- include "ap.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ap.fullname" . }}-model
  labels:
    {{- include "ap.labels" (dict "ctx" . "component" "model") | nindent 4 }}
spec:
  selector:
    {{- include "ap.selectorLabels" (dict "ctx" . "component" "model") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.model.service.port }}
      targetPort: http
{{- end }}

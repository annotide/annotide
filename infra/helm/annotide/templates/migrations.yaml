{{- if .Values.migrations.enabled }}
{{- /*
Runs before the release's own resources exist on a first install, so it
cannot use the release ConfigMap or Secret. With `secrets.existingSecret`
it reads that Secret; otherwise a hook-scoped copy of the chart's secret
keys, removed again once the migration succeeds.
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ap.fullname" . }}-migrate-env
  labels:
    {{- include "ap.labels" (dict "ctx" . "component" "migrations") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- include "ap.secretData" . | nindent 2 }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ap.fullname" . }}-migrate
  labels:
    {{- include "ap.labels" (dict "ctx" . "component" "migrations") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "ap.selectorLabels" (dict "ctx" . "component" "migrations") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "ap.podSecurityContext" (dict "ctx" . "uid" .Values.backend.uid) | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "ap.image" (dict "ctx" . "image" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: APP_ENV
              value: production
          envFrom:
            - secretRef:
                name: {{ default (printf "%s-migrate-env" (include "ap.fullname" .)) .Values.secrets.existingSecret }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- include "ap.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}

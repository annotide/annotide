{{- if .Values.networkPolicy.enabled }}
{{- $port := dict "frontend" 8080 "backend" 8000 "model" 9000 }}
# The frontend: the only entry point (the Ingress routes everything to it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-frontend
  labels:
    {{- include "ap.labels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ $port.frontend }} }
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
        # `helm test` goes through the frontend like a browser does.
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "ctx" $ "component" "test") | nindent 14 }}
      {{- end }}
---
# The API: from the frontend's nginx (`/api/` proxy), plus any extra peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-backend
  labels:
    {{- include "ap.labels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ $port.backend }} }
      from:
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 14 }}
        {{- if .Values.model.enabled }}
        # The model fetches local / proxied media from APP_INTERNAL_API_URL.
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "ctx" . "component" "model") | nindent 14 }}
        {{- end }}
        {{- with .Values.networkPolicy.backendExtraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if .Values.model.enabled }}
---
# The reference model service: called by the API (smart tools) and the worker (pre-labelling).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-model
  labels:
    {{- include "ap.labels" (dict "ctx" . "component" "model") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "ctx" . "component" "model") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ $port.model }} }
      from:
        {{- range $component := list "backend" "worker" }}
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "ctx" $ "component" $component) | nindent 14 }}
        {{- end }}
{{- end }}
{{- range $component := list "worker" "migrations" }}
---
# The {{ $component }} serves nothing: no ingress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" $ }}-{{ $component }}
  labels:
    {{- include "ap.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
{{- end }}
{{- end }}

{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ap.secretName" . }}
  labels:
    {{- include "ap.labels" (dict "ctx" . "component" "config") | nindent 4 }}
type: Opaque
stringData:
  {{- include "ap.secretData" . | nindent 2 }}
{{- end }}
{{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.secretKey) .Values.secrets.generateSecretKey }}
---
# The generated APP_SECRET_KEY, kept apart from the release: it seals MFA
# and webhook secrets in the database, so it must outlive `helm uninstall`
# together with the data (as the in-cluster PostgreSQL's password does).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ap.secretKeySecretName" . }}
  labels:
    {{- include "ap.labels" (dict "ctx" . "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ include "ap.secretKey" . | quote }}
{{- end }}

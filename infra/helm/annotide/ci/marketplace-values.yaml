# What an Azure Marketplace install renders with: the bundle's values
# (infra/marketplace/values.yaml) plus the install form's settings, which
# the cluster extension may pass as strings ("true"), for `helm lint` /
# kubeconform in CI.
global:
  azure:
    images:
      backend: { registry: ghcr.io/annotide, image: annotide-backend, tag: 0.1.0 }
      frontend: { registry: ghcr.io/annotide, image: annotide-frontend, tag: 0.1.0 }
      postgresql: { registry: docker.io/library, image: postgres, tag: 16.15-alpine }
      valkey: { registry: docker.io/valkey, image: valkey, tag: 9.1.2-alpine }
secrets:
  generateSecretKey: true
postgresql:
  enabled: "true"
  persistence:
    azureDisk:
      enabled: true
      skuName: StandardSSD_ZRS
valkey:
  enabled: "true"
publicUrl: https://annotate.example.com
ingress:
  enabled: "true"
  className: webapprouting.kubernetes.azure.com
  host: annotate.example.com
  clusterIssuer: letsencrypt
